[project]
name = "webtools-ui"
version = "0.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = [".", "scripts"]

[tool.coverage.run]
branch = true
source = ["python", "scripts"]
omit = [
    "scripts/build_pitch_narration.py",
    "scripts/harmonize_pitch_decks.py",
    "scripts/capture-pitch-screenshots.mjs",
]

[tool.coverage.report]
fail_under = 15
show_missing = true
skip_covered = true

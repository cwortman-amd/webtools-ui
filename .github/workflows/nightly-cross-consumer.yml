name: Nightly cross-consumer smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-cross-consumer
  cancel-in-progress: false

jobs:
  cross-consumer-smoke:
    name: L0 + L2 Playwright smoke (all consumers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout webtools-ui
        uses: actions/checkout@v4
        with:
          path: webtools-ui

      - name: Checkout consumer repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ws="$(dirname "$GITHUB_WORKSPACE")"
          for repo in cluster-manager dc-planner llm-benchmark knowledge-exchange demo-portal slide-presenter; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/${repo}.git" "${ws}/${repo}"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (dc-planner)
        working-directory: ../dc-planner
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run cross-consumer smoke (with Playwright)
        working-directory: webtools-ui
        env:
          WORKSPACE: ${{ github.workspace }}/..
        run: make cross-consumer-smoke
